// Настройки разрешения экрана (1920x1080)
seta r_fullscreen "1"
seta r_customwidth "1920"
seta r_customheight "1080"
seta r_mode "-1"

// Вертикальная синхронизация (VSync)
seta r_swapInterval "1"

// Корректный угол обзора для экрана 16:9
seta cg_fov "110"

// Выделение памяти под AI-rescaled текстуры (чтобы игра не вылетала)
seta com_hunkMegs "512"
seta com_zoneMegs "64"


seta r_picmip "0"                  // Максимальное качество текстур (0 - без сжатия)
seta r_ext_compressed_textures "0" // Отключить компрессию текстур
seta r_roundImagesToPowersOfTwo "0"// Запретить игре округлять разрешение текстур

seta sv_pure 0 // чтобы cgame не работал из ванильных паков // обязательно запускать сервак с тем же параметром!!!

bind MOUSE2 "grenade_toggle" //для переключения режима гранатомета
